name: Build NRO unsigned IPA

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag hoặc commit SHA trong Mrk4tsu/NRO'
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: nro-ios
  cancel-in-progress: false

jobs:
  build:
    name: Unity → Xcode → unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check Unity credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo '::error::Add UNITY_EMAIL and UNITY_PASSWORD to BuildGithub Actions secrets.'
            exit 1
          fi
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo '::error::Add UNITY_LICENSE (Personal) or UNITY_SERIAL (Pro) to BuildGithub Actions secrets.'
            exit 1
          fi

      - name: Download Unity source snapshot without cloning NRO
        id: source
        env:
          GH_TOKEN: ${{ secrets.NRO_READ_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python3 ci/fetch_source.py

      - name: Export Xcode project with Unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: iOS
          buildMethod: IosCiBuild.Export
          versioning: None
          cacheUnityInstallationOnMac: false

      - name: Build and package unsigned IPA
        run: bash ci/build-unsigned.sh

      - name: Upload only the IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NRO-iOS-unsigned-${{ steps.source.outputs.sha }}
          path: output/GaMod-unsigned.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary source and build files
        if: always()
        run: python3 ci/cleanup.py
